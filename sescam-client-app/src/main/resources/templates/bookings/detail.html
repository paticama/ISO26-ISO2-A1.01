<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking Detail – SESCAM</title>
    <style>
        :root { --border: #d0d7de; --error: #b42318; --ok: #1a7f37; --bg: #f6f8fa; }
        body { margin: 0; font-family: system-ui, sans-serif; color: #1f2328; background: #fff; }
        header { padding: 16px; border-bottom: 1px solid var(--border); background: var(--bg); }
        main { padding: 16px; max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
        .card { padding: 12px; border: 1px solid var(--border); border-radius: 6px; }
        .message.error { padding: 12px; border: 1px solid var(--error); color: var(--error); border-radius: 6px; }
        label { display: block; margin-bottom: 8px; }
        input { padding: 6px; border: 1px solid var(--border); border-radius: 4px; }
        button { padding: 6px 12px; border-radius: 6px; border: 1px solid #0969da; background: #0969da; color: #fff; cursor: pointer; }
        button.danger { background: #b42318; border-color: #b42318; }
    </style>
</head>
<body>
<header>
    <h1>Booking Detail</h1>
    <a th:href="@{/bookings}">Back to Admissions Bookings</a>
</header>
<main>
    <div th:if="${failure != null}" class="message error" id="failure" role="alert" th:text="${failure.message}"></div>

    <div th:if="${booking != null}" class="card" id="booking-detail">
        <div>Booking ID: <strong id="booking-id" th:text="${booking.bookingId()}"></strong></div>
        <div>Order ID: <span th:text="${booking.orderId()}"></span></div>
        <div>Patient ID: <span th:text="${booking.patientId()}"></span></div>
        <div>Slot: <span th:text="|${booking.slotId()} (${booking.scheduledStart()} - ${booking.scheduledEnd()})|"></span></div>
        <div>Status: <strong id="booking-status" th:text="${booking.status()}"></strong></div>
        <div>Notification: <span id="notification-status" th:text="${booking.notificationStatus()}"></span></div>

        <h3>History</h3>
        <ul>
            <li th:each="h : ${booking.history()}"
                th:text="|${h.previousStatus()} -> ${h.newStatus()} (${h.reason()}) by ${h.changedBy()}|"></li>
        </ul>

        <h3>Reschedule (A2)</h3>
        <form method="post" th:action="@{/bookings/{id}/reschedule(id=${booking.bookingId()})}">
            <input type="hidden" name="expectedBookingVersion" th:value="${booking.version()}" />
            <label>New Slot ID <input type="text" name="newSlotId" required /></label>
            <label>Expected Slot Version <input type="number" name="expectedSlotVersion" value="1" min="0" required /></label>
            <label>Reason <input type="text" name="reason" required /></label>
            <button type="submit">Reschedule</button>
        </form>

        <h3>Cancel (A3)</h3>
        <form method="post" th:action="@{/bookings/{id}/cancel(id=${booking.bookingId()})}">
            <input type="hidden" name="expectedBookingVersion" th:value="${booking.version()}" />
            <label>Reason <input type="text" name="reason" required /></label>
            <button type="submit" class="danger">Cancel booking</button>
        </form>
    </div>
</main>
</body>
</html>
