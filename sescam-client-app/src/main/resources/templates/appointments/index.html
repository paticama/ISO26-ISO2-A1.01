<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Appointments – SESCAM</title>
    <style>
        :root { --border: #d0d7de; --error: #b42318; --bg: #f6f8fa; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; color: #1f2328; }
        header, th { background: var(--bg); }
        header, main { padding: 16px; }
        main { max-width: 1000px; margin: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 9px; border: 1px solid var(--border); text-align: left; }
        .message { margin: 12px 0; padding: 12px; border: 1px solid var(--border); border-radius: 6px; }
        .error { color: var(--error); border-color: var(--error); }
    </style>
</head>
<body>
<header><h1>My Appointments</h1></header>
<main>
    <p th:if="${failure != null}" class="message error" role="alert" th:text="${failure}"></p>
    <p th:if="${success != null}" class="message" role="status" th:text="${success}"></p>
    <p th:if="${empty != null and empty}" id="no-appointments">
        You have no upcoming appointments. You can review your planned follow-ups from your
        <a th:href="@{/follow-ups}">care plan</a>.
    </p>
    <table th:if="${appointments != null and !appointments.isEmpty()}" id="appointment-list">
        <thead><tr><th>Date and time</th><th>Examination</th><th>Modality</th><th>Location</th><th>Status</th><th>Details</th></tr></thead>
        <tbody>
        <tr th:each="a : ${appointments}">
            <td th:text="${a.scheduledStart()} + ' – ' + ${a.scheduledEnd()}"></td>
            <td th:text="${a.examTypeName() != null ? a.examTypeName() : a.modality()}"></td>
            <td th:text="${a.modality()}"></td>
            <td th:text="${a.locationId()} + ' / ' + ${a.resourceId()}"></td>
            <td th:text="${a.status()}"></td>
            <td><a th:href="@{/appointments/{id}(id=${a.bookingId()})}">View preparation and actions</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
